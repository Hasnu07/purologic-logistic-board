# Publishes the live site whenever a change lands on main.
name: Publish to live site
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: the app runs on a single machine with one data volume.
concurrency:
  group: deploy-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
